[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "historypy"
version = "1.0.0"
description = "An evidence-aware Python toolkit for historical research and analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HistoryPy contributors" }]
keywords = ["history", "historical-research", "chronology", "humanities", "evidence"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/rn577534-beep/HistoryPy"
Repository = "https://github.com/rn577534-beep/HistoryPy"
Issues = "https://github.com/rn577534-beep/HistoryPy/issues"
Releasing = "https://github.com/rn577534-beep/HistoryPy/blob/feat/evidence-centered-reasoning/docs/releasing.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
semantic = ["sentence-transformers>=3.0,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
