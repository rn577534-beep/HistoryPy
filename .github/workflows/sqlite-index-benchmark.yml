name: SQLite persistent index benchmark

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sqlite-index-benchmark.yml"
      - "benchmarks/benchmark_sqlite_store.py"
      - "src/historypy/io/sqlite_normalized.py"
      - "tests/test_sqlite_normalized.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historypy-sqlite-scale
  cancel-in-progress: true

jobs:
  sqlite-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        records: [100000, 1000000]
        journal-mode: [DELETE, WAL]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Benchmark persistent SQLite index
        run: python benchmarks/benchmark_sqlite_store.py --records ${{ matrix.records }} --journal-mode ${{ matrix.journal-mode }}
