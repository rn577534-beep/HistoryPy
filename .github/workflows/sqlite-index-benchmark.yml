name: SQLite persistent index benchmark

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sqlite-index-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        records: [100000, 1000000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Benchmark persistent SQLite index
        run: python benchmarks/benchmark_sqlite_store.py --records ${{ matrix.records }}
