name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: pytest
      - name: Lint
        run: ruff check .
      - name: Smoke-test synthetic search benchmark
        run: python benchmarks/benchmark_search.py --records 10000 --repeat 3


  package:
    name: Build and verify distributable packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - name: Verify MIT license is included in both distributions
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import tarfile

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))

          with ZipFile(wheel) as archive:
              names = archive.namelist()
              assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names), names
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = archive.read(metadata_name).decode()
              assert "License-Expression: MIT" in metadata, metadata

          with tarfile.open(sdist, "r:gz") as archive:
              names = archive.getnames()
              assert any(name.endswith("/LICENSE") for name in names), names

          print("Wheel and source distribution both contain MIT license metadata.")
          PY
      - name: Install built wheel and smoke-test public import
        run: |
          python -m pip install --no-deps dist/*.whl
          python -c "import historypy; assert historypy.__version__; print(historypy.__version__)"
