name: Scale Benchmarks

concurrency:
  group: historypy-scale-benchmarks
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "benchmarks/benchmark_scale.py"
      - "src/historypy/**"
      - ".github/workflows/scale-benchmarks.yml"
  workflow_dispatch:

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        records: [100000, 1000000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Benchmark ${{ matrix.records }} records
        run: python benchmarks/benchmark_scale.py --records ${{ matrix.records }} --repeat 1
      - name: Smoke-test cache and batch benchmark
        if: matrix.records == 100000
        run: python benchmarks/benchmark_cached_search.py --records 1000 --repeat 1 --workers 2
