name: Four-system historical retrieval benchmark

on:
  push:
    branches: [main]
    paths:
      - "benchmarks/benchmark_four_systems.py"
      - "benchmarks/benchmark_historian_relevance.py"
      - "benchmarks/benchmark_hybrid_retrieval.py"
      - "src/historypy/research/benchmark.py"
      - "src/historypy/research/embeddings.py"
      - "src/historypy/research/semantic.py"
      - "src/historypy/research/hybrid.py"
      - ".github/workflows/four-system-historical-relevance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historypy-four-system-historical-relevance
  cancel-in-progress: true

jobs:
  four-system-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install optional CPU semantic dependencies
        run: python -m pip install -e ".[semantic]"
      - name: Download pinned CC-BY-4.0 HistoriQA corpus
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/atomegoyan/historiqa-thirdrepublic/08bf3cc5f25ae5cd065ce8330f4275147081ab66/dataset/corpus_dataset.jsonl \
            --output corpus_dataset.jsonl
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/atomegoyan/historiqa-thirdrepublic/08bf3cc5f25ae5cd065ce8330f4275147081ab66/dataset/question_dataset.jsonl \
            --output question_dataset.jsonl
      - name: Run Trigram, BM25, Semantic, and Hybrid benchmark
        env:
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python benchmarks/benchmark_four_systems.py \
            --corpus corpus_dataset.jsonl \
            --questions question_dataset.jsonl \
            --top-k 10 \
            --test-fraction 0.2 \
            --split-seed 2026 \
            --bootstrap-samples 5000 \
            --semantic-model sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 \
            --output four-system-historical-relevance.json
      - name: Upload machine-readable benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: historypy-four-system-historical-relevance
          path: four-system-historical-relevance.json
          if-no-files-found: error
